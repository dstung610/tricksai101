<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PSV Marker Editor</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.13.3/index.min.css"
    />

    <style>
      body {
        margin: 0;
        font-family: Arial;
        height: 100vh;
        display: flex;
      }
      #left {
        width: 320px;
        padding: 10px;
        box-sizing: border-box;
        background: #f5f5f5;
        overflow: auto;
      }
      #viewer {
        flex: 1;
      }
      label {
        display: block;
        margin-top: 8px;
        font-weight: bold;
      }
      select,
      button {
        width: 100%;
        margin-top: 4px;
        padding: 6px;
      }
      #log {
        font-size: 12px;
        white-space: pre-wrap;
        background: #fff;
        border: 1px solid #ccc;
        padding: 8px;
        height: 320px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="left">
      <h3>Marker Editor</h3>

      <label>Panorama</label>
      <select id="panoSelect"></select>

      <label>Destination</label>
      <select id="destSelect"></select>

      <button id="exportBtn">Export JSON</button>
      <input type="file" id="importFile" />

      <p><b>Click anywhere on panorama to create a marker.</b></p>

      <div id="log"></div>
    </div>

    <div id="viewer"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.13.3/index.module.js",
          "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.13.3/index.module.js"
        }
      }
    </script>

    <script type="module">
      import { Viewer } from "@photo-sphere-viewer/core";
      import { MarkersPlugin } from "@photo-sphere-viewer/markers-plugin";

      const baseUrl = "./assets-web/";

      const filenames = [
        "T1-1.JPG",
        "T1-2.JPG",
        "T1-3.JPG",
        "T1-4.JPG",
        "T1-5.JPG",
        "T2-1.JPG",
        "T2-202-1.JPG",
        "T2-202-2.JPG",
        "T2-202-3.JPG",
        "T3-301-1.JPG",
        "T3-301-2.JPG",
        "T3-301-3.JPG",
        "T5-1.JPG",
        "T5-502-1.JPG",
        "T5-502-2.JPG",
        "T5-502-3.JPG",
        "T7-1.JPG",
        "T7-2.JPG",
        "T7-701-1.JPG",
        "T7-701-2.JPG",
        "T7-702-1.JPG",
        "T7-702-2.JPG",
        "T7-702-3.JPG",
      ];

      const data = {};

      const pano = document.getElementById("panoSelect");
      const dest = document.getElementById("destSelect");
      const log = document.getElementById("log");

      filenames.forEach((f) => {
        pano.add(new Option(f, f));
        dest.add(new Option(f, f));
        data[f] = [];
      });

      const viewer = new Viewer({
        container: document.querySelector("#viewer"),
        panorama: baseUrl + filenames[0],
        navbar: ["zoom", "move", "fullscreen"],
        plugins: [[MarkersPlugin]],
      });

      const markers = viewer.getPlugin(MarkersPlugin);

      function redraw() {
        markers.clearMarkers();

        const list = data[pano.value] || [];

        list.forEach((m, i) => {
          markers.addMarker({
            id: "m" + i,
            position: { yaw: m.yaw, pitch: m.pitch },
            html: `<div style="width:20px;height:20px;background:red;border-radius:50%;color:white;font-size:10px;text-align:center;line-height:20px">${i + 1}</div>`,
            tooltip: m.to,
          });
        });

        log.textContent = JSON.stringify(data[pano.value], null, 2);
      }

      async function loadCurrent() {
        await viewer.setPanorama(baseUrl + pano.value);
        redraw();
      }

      pano.onchange = loadCurrent;

      viewer.addEventListener("click", ({ data: pos }) => {
        if (!pos) return;

        data[pano.value].push({
          to: dest.value,
          yaw: pos.yaw,
          pitch: pos.pitch,
        });

        redraw();
      });

      markers.addEventListener("select-marker", (e) => {
        const idx = parseInt(e.marker.id.substring(1));
        if (confirm("Delete marker?")) {
          data[pano.value].splice(idx, 1);
          redraw();
        }
      });

      document.getElementById("exportBtn").onclick = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "markers.json";
        a.click();
      };

      document.getElementById("importFile").onchange = (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          const obj = JSON.parse(r.result);
          Object.keys(obj).forEach((k) => {
            if (data[k] !== undefined) data[k] = obj[k];
          });
          redraw();
        };
        r.readAsText(file);
      };

      loadCurrent();
    </script>
  </body>
</html>
